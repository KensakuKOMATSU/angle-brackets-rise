<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StackChan Web Bluetooth Minimal</title>
</head>

<body>
    <h1>StackChan Web Bluetooth</h1>
    <button id="connect">接続</button>
    <button id="disconnect" disabled>切断</button>
    <p id="status">未接続</p>
    <textarea id="message" rows="5"
        cols="60">{"command":"control","expression":"happy","mouth":{"type":"open","open_ratio":0}}</textarea>
    <button id="send" disabled>送信</button>
    <h2>受信</h2>
    <pre id="received"></pre>

    <script>
        const serviceUuid = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const rxUuid = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const txUuid = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
        const connectButton = document.querySelector('#connect');
        const disconnectButton = document.querySelector('#disconnect');
        const sendButton = document.querySelector('#send');
        const status = document.querySelector('#status');
        const message = document.querySelector('#message');
        const received = document.querySelector('#received');
        const encoder = new TextEncoder();
        const decoder = new TextDecoder();
        let device;
        let server;
        let rx;
        let tx;
        let pendingReceive = '';

        function setConnected(connected) {
            connectButton.disabled = connected;
            disconnectButton.disabled = !connected;
            sendButton.disabled = !connected;
            status.textContent = connected ? '接続中' : '未接続';
        }

        connectButton.addEventListener('click', async () => {
            try {
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [serviceUuid] }]
                });
                device.addEventListener('gattserverdisconnected', () => setConnected(false));
                server = await device.gatt.connect();
                const service = await server.getPrimaryService(serviceUuid);
                rx = await service.getCharacteristic(rxUuid);
                tx = await service.getCharacteristic(txUuid);
                pendingReceive = '';
                tx.addEventListener('characteristicvaluechanged', event => {
                    pendingReceive += decoder.decode(event.target.value, { stream: true });
                    const lines = pendingReceive.split(/\r?\n/);
                    pendingReceive = lines.pop();
                    for (const line of lines.filter(Boolean)) {
                        received.textContent = `${line}\n${received.textContent}`;
                    }
                });
                await tx.startNotifications();
                setConnected(true);
            } catch (error) {
                received.textContent = `${error.message}\n${received.textContent}`;
            }
        });

        sendButton.addEventListener('click', async () => {
            try {
                const json = JSON.stringify(JSON.parse(message.value));
                await rx.writeValueWithResponse(encoder.encode(json));
            } catch (error) {
                received.textContent = `${error.message}\n${received.textContent}`;
            }
        });

        disconnectButton.addEventListener('click', () => {
            device?.gatt?.disconnect();
            pendingReceive = '';
            setConnected(false);
        });
    </script>
</body>

</html>
